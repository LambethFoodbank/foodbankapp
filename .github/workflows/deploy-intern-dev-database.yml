name: Deploy intern-dev database
on:
  workflow_dispatch:
  push:
    paths:
      - supabase/migrations/**.sql
    branches:
      - intern-dev

env:
  SUPABASE_INTERN_DEV_PROJECT_ID: ${{ secrets.SUPABASE_INTERN_DEV_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_INTERN_DEV_DATABASE_PASSWORD }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_INTERN_DEV_ACCESS_TOKEN }}

jobs:
  deploy-intern-dev-database:
    name: Deploy intern-dev database
    environment: intern-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5

      - name: Link to the project
        run: npx supabase link --project-ref $SUPABASE_INTERN_DEV_PROJECT_ID
      - name: Dry run the migration
        run: npx supabase db push --dry-run --include-all
      - name: Apply the migration
        run: npx supabase db push --include-all

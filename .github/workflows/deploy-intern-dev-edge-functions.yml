name: Deploy edge functions to intern-dev
on:
  workflow_dispatch:
  push:
    paths:
      - supabase/functions/**
    branches:
      - intern-dev

env:
  SUPABASE_INTERN_DEV_PROJECT_ID: ${{ secrets.SUPABASE_INTERN_DEV_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_INTERN_DEV_DATABASE_PASSWORD }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_INTERN_DEV_ACCESS_TOKEN }}

jobs:
  deploy-intern-dev-edge-functions:
    name: Deploy edge functions to intern-dev
    environment: intern-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Link to the project
        run: npx supabase link --project-ref $SUPABASE_INTERN_DEV_PROJECT_ID

      - name: Deploy edge functions
        run: npx supabase functions deploy
